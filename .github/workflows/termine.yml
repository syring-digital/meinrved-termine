# Kalenderabo der WSGE-Termine: liest wsge.de, schreibt termine.ics und veröffentlicht sie über GitHub Pages.
# Läuft mehrmals täglich; fällt wsge.de aus, bleibt die zuletzt veröffentlichte Datei erhalten.
# Veröffentlicht wird per Branch "gh-pages" (Pages-Quelle: Branch). Der frühere Weg über deploy-pages blieb am 04.11.2026
# im Status "leer" hängen und hat Änderungen der Sperrliste nicht ausgeliefert.
name: Termine aktualisieren
on:
  schedule:
    - cron: '20 5,16 * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: termine
  cancel-in-progress: false
jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python termine_ics.py site/termine.ics
      - run: cp index.html site/index.html && cp sperrliste.json site/sperrliste.json
      - name: Auf gh-pages veröffentlichen
        run: |
          touch site/.nojekyll
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Veröffentlicht von ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
